site_name: MemoRizz
site_description: Documentation for the MemoRizz memory framework for AI agents
site_url: https://richmondalake.github.io/memorizz
repo_name: RichmondAlake/memorizz
repo_url: https://github.com/RichmondAlake/memorizz
edit_uri: edit/main/docs/
exclude_docs: |
  README.md
  issues/*
  observability-roadmap.md

nav:
  - Home: index.md
  - Start Here:
      - Choose Your Path: getting-started/overview.md
      - Installation: getting-started/installation.md
      - Core Concepts: getting-started/concepts.md
      - Model Providers: getting-started/model-providers.md
      - Python SDK Quickstart: getting-started/python-sdk-quickstart.md
      - CLI Guide: getting-started/cli.md
      - Local UI Guide: getting-started/local-ui.md
  - Build Agents:
      - Memory-First Meta-Harness: guides/meta-harness.md
      - Tools, Safety & Approvals: guides/tools-and-approvals.md
      - Scheduled Automations: guides/automations.md
      - Agent Modes:
          - Assistant: use-cases/assistant-mode.md
          - Workflow: use-cases/workflow-mode.md
          - Deep Research: use-cases/deep-research-mode.md
      - MCP Integrations:
          - Connect to MCP Servers: guides/mcp-connectivity.md
          - Expose MemoRizz as an MCP Server: guides/mcp-server.md
      - Internet Access: internet-access/providers.md
      - Browser Control: browser-control/index.md
      - Code Execution:
          - Choose a Provider: sandbox/index.md
          - E2B: sandbox/e2b.md
          - Daytona: sandbox/daytona.md
          - GraalPy: sandbox/graalpy.md
      - Skills Marketplace: skills-marketplace/index.md
  - Memory:
      - Memory Types:
          - Semantic Memory: memory-types/semantic.md
          - Episodic Memory: memory-types/episodic.md
          - Procedural Memory: memory-types/procedural.md
          - Short-Term Memory: memory-types/short-term.md
          - Shared Memory: memory-types/shared.md
      - Memory Providers:
          - Choose a Provider: memory-providers/filesystem.md
          - MongoDB: memory-providers/mongodb.md
          - Oracle AI Database: memory-providers/oracle.md
          - Bring Your Own Provider: memory-providers/custom.md
      - Multi-Tenant Applications: guides/multi-tenant.md
      - Context Efficiency & Prompt Caching: guides/context-efficiency.md
      - Streaming Delivery: guides/streaming.md
  - Continual Learning:
      - Workflows to Skills: guides/continual-learning.md
      - Learning Control Plane: guides/learning-control-plane.md
  - Operate:
      - Configuration & Secrets: reference/configuration.md
      - Observability & Trace Inspection: observability-ui.md
      - Observability Rollout & Operator Guide: observability-rollout.md
      - Production Governance: guides/production-governance.md
      - Capabilities & Preflight: reference/capabilities.md
      - Troubleshooting: troubleshooting.md
  - Evaluate & Research:
      - Evaluation Suite: evaluation-suite.md
      - Terminal-Bench Evaluation: terminal-bench.md
      - Research Papers: research-paper.md
  - Reference:
      - Python SDK API: reference/python-api.md
      - Context Window Stats: utilities/context_window_stats.md

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
    - scheme: slate
      primary: deep purple
      accent: lime
  font:
    text: "Inter"
    code: "JetBrains Mono"

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys

plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true
      enable_creation_date: false
      enable_git_follow: false
      # Untracked pages in a release worktree legitimately have no Git date.
      # Keep MkDocs strict for links/config while allowing the documented
      # build-date fallback for this metadata-only plugin.
      strict: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_if_no_docstring: false
            filters: []
            heading_level: 2
            show_category_heading: true
            show_source: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RichmondAlake/memorizz
