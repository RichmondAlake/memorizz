site_name: MemoRizz
site_description: Documentation for the MemoRizz memory framework for AI agents
site_url: https://richmondalake.github.io/memorizz
repo_name: RichmondAlake/memorizz
repo_url: https://github.com/RichmondAlake/memorizz
edit_uri: edit/main/docs/
exclude_docs: README.md

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Concepts: getting-started/concepts.md
      - Python SDK Quickstart: getting-started/python-sdk-quickstart.md
      - CLI Guide: getting-started/cli.md
      - Local UI Guide: getting-started/local-ui.md
  - Memory Types:
      - Semantic Memory: memory-types/semantic.md
      - Episodic Memory: memory-types/episodic.md
      - Procedural Memory: memory-types/procedural.md
      - Short-Term Memory: memory-types/short-term.md
      - Shared Memory: memory-types/shared.md
  - Memory Providers:
      - Oracle Provider: memory-providers/oracle.md
      - MongoDB Provider: memory-providers/mongodb.md
      - Filesystem Provider: memory-providers/filesystem.md
      - Bring Your Own Provider: memory-providers/custom.md
  - Guides:
      - Multi-Tenant Applications: guides/multi-tenant.md
      - Context Efficiency & Prompt Caching: guides/context-efficiency.md
      - Continual Learning (Workflows → Skills): guides/continual-learning.md
  - Use Cases:
      - Assistant Mode: use-cases/assistant-mode.md
      - Workflow Mode: use-cases/workflow-mode.md
      - Deep Research Mode: use-cases/deep-research-mode.md
  - Skills Marketplace:
      - Overview: skills-marketplace/index.md
  - Internet Access Providers: internet-access/providers.md
  - Sandbox Providers:
      - Overview: sandbox/index.md
      - E2B Provider: sandbox/e2b.md
      - Daytona Provider: sandbox/daytona.md
      - GraalPy Provider: sandbox/graalpy.md
  - Utilities:
      - Context Window Stats: utilities/context_window_stats.md

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
    - scheme: slate
      primary: deep purple
      accent: lime
  font:
    text: "Inter"
    code: "JetBrains Mono"

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys

plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true
      enable_creation_date: false
      enable_git_follow: false
      # Untracked pages in a release worktree legitimately have no Git date.
      # Keep MkDocs strict for links/config while allowing the documented
      # build-date fallback for this metadata-only plugin.
      strict: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_if_no_docstring: false
            filters: []
            heading_level: 2
            show_category_heading: true
            show_source: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RichmondAlake/memorizz
