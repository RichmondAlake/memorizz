name: Publish

# Tag-triggered release (or explicit recovery dispatch): test -> build -> PyPI
# (OIDC trusted publishing) -> GitHub release -> bump the Homebrew tap +
# publish the npm shim.
# The pyproject `version` is the source of truth; the vX.Y.Z tag must match it
# (enforced below) so the wheel, npm shim, and brew formula all agree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to release or resume"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # UI routes are part of the release suite; provider SDKs are included by
      # the dev extra so Oracle/MongoDB/Anthropic tests do not silently skip.
      - run: pip install -e ".[dev,ui,mcp]"
      # Match test.yml: tests/performance is excluded — it's flaky on shared
      # CI runners, and a release gate must not be flakier than CI.
      - run: pytest tests/unit tests/integration -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v5
      - name: Verify tag matches pyproject version
        run: |
          TAG="${RELEASE_TAG#v}"
          PROJ=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$PROJ"
          test "$TAG" = "$PROJ" || { echo "::error::tag v$TAG != pyproject version $PROJ — bump pyproject.toml before tagging"; exit 1; }
      - name: Build sdist + wheel
        run: uv build
      - name: Check artifacts
        run: |
          uvx twine check dist/*
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          sdist = next(Path("dist").glob("*.tar.gz"))
          blocked_names = {".env", "secrets.json", "credentials.json"}
          blocked_suffixes = (
              ".local.md", ".key", ".pem", ".p12", ".pfx", ".secret"
          )
          blocked_roots = {".venv", "dist", "reports", "research", "site"}
          blocked_segments = {
              ("docs", "releases"),
              ("eval", "datasets"),
              ("src-tauri", "gen"),
              ("src-tauri", "target"),
          }

          def is_blocked(name):
              parts = PurePosixPath(name).parts[1:]  # strip versioned root
              if not parts:
                  return False
              basename = parts[-1]
              pairs = set(zip(parts, parts[1:]))
              return (
                  parts[0] in blocked_roots
                  or "node_modules" in parts
                  or basename in blocked_names
                  or basename.startswith(".env.")
                  or basename.endswith(blocked_suffixes)
                  or ("docs" in parts and "report" in basename and basename.endswith(".md"))
                  or bool(pairs & blocked_segments)
              )

          with tarfile.open(sdist, "r:gz") as archive:
              blocked = [m.name for m in archive.getmembers() if is_blocked(m.name)]
          if blocked:
              raise SystemExit(f"Blocked local/generated files in sdist: {blocked}")
          print("sdist content policy: OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Clean-room install check: a bare `pip install memorizz` (no extras) must run
  # the default zero-config stack yet stay lean. Guards the dependency closure —
  # a dev/test env can mask a missing base dep (e.g. the ollama client) or a
  # heavy one leaking in (e.g. langchain_ollama / torch). Gates the publish.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the built wheel into a clean venv (base deps only)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet --upgrade pip
          /tmp/clean/bin/python -m pip install --quiet dist/*.whl
      - name: Dependency closure (default stack present, heavy deps absent)
        run: |
          /tmp/clean/bin/python -c "
          import importlib.util as u
          has = lambda m: u.find_spec(m) is not None
          assert has('memorizz') and has('ollama'), 'default zero-config stack deps missing from base'
          leaked = [m for m in ['langchain_ollama', 'torch', 'transformers', 'faiss'] if has(m)]
          assert not leaked, f'heavy deps leaked into base install: {leaked}'
          optional = [m for m in ['mcp', 'cryptography', 'uvicorn'] if has(m)]
          assert not optional, f'optional MCP dependencies leaked into base: {optional}'
          import memorizz; print('clean-room OK:', memorizz.__version__)
          "
      - name: CLI entrypoints work without a daemon
        run: |
          /tmp/clean/bin/memorizz --version
          /tmp/clean/bin/memorizz --help >/dev/null
      - name: MCP extra closes the optional dependency set
        run: |
          python -m venv /tmp/mcp
          /tmp/mcp/bin/python -m pip install --quiet --upgrade pip
          WHEEL_PATH=$(find "$PWD/dist" -name '*.whl' -print -quit)
          /tmp/mcp/bin/python -m pip install --quiet "${WHEEL_PATH}[mcp]"
          /tmp/mcp/bin/python -c "
          import memorizz
          report = memorizz.capabilities()
          assert report['features']['mcp_client']['available'], report
          assert report['features']['mcp_server']['available'], report
          print('mcp extra OK:', memorizz.__version__)
          "

  pypi:
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC -> PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check for an existing exact PyPI release
        id: existing
        run: |
          VER="${RELEASE_TAG#v}"
          if ! curl -fsS "https://pypi.org/pypi/memorizz/${VER}/json" -o /tmp/pypi.json; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          import tempfile
          import urllib.request
          from pathlib import Path

          release = json.loads(Path("/tmp/pypi.json").read_text())["urls"]
          published = {item["filename"]: item for item in release}
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.is_file()
          }
          if set(published) != set(local):
              raise SystemExit(
                  "PyPI already has this version, but its artifact filenames do "
                  f"not match this tag build.\npublished={set(published)}"
                  f"\nlocal={set(local)}"
              )

          def normalized_sdist(path):
              entries = {}
              with tarfile.open(path, "r:*") as archive:
                  for member in archive.getmembers():
                      if not member.isfile():
                          continue
                      # Ignore the versioned root directory, but compare every
                      # source filename and byte. gzip/tar timestamps, uid/gid,
                      # and host-specific container metadata are intentionally
                      # outside the source-equivalence check.
                      parts = Path(member.name).parts
                      name = "/".join(parts[1:] if len(parts) > 1 else parts)
                      handle = archive.extractfile(member)
                      entries[name] = hashlib.sha256(handle.read()).hexdigest()
              return entries

          for filename, local_digest in local.items():
              item = published[filename]
              published_digest = item["digests"]["sha256"]
              if item["packagetype"] != "sdist":
                  if published_digest != local_digest:
                      raise SystemExit(
                          f"Published {filename} does not match this tag build: "
                          f"{published_digest} != {local_digest}"
                      )
                  continue
              if published_digest == local_digest:
                  continue
              with tempfile.NamedTemporaryFile(suffix=".tar.gz") as downloaded:
                  urllib.request.urlretrieve(item["url"], downloaded.name)
                  if normalized_sdist(downloaded.name) != normalized_sdist(
                      Path("dist") / filename
                  ):
                      raise SystemExit(
                          f"Published {filename} has different source contents "
                          "from this tag build."
                      )
          print(
              "PyPI already contains tag-equivalent artifacts "
              "(wheel bytes exact; sdist source contents exact)."
          )
          PY
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.existing.outputs.present != 'true'

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract curated release notes
        run: |
          VER="${RELEASE_TAG#v}"
          awk -v version="$VER" '
            $0 ~ "^## " version " " { emitting=1; next }
            /^## / && emitting { exit }
            emitting { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MemoRizz ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  npm:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check npm token
        id: gate
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN not configured - skipping npm shim publication."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Test npm launcher
        if: steps.gate.outputs.enabled == 'true'
        working-directory: packaging/npm
        run: node test/launcher.test.js
      - name: Sync version + publish shim
        if: steps.gate.outputs.enabled == 'true'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          VER="${RELEASE_TAG#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          if npm view "memorizz@$VER" version >/dev/null 2>&1; then
            echo "npm already contains memorizz@$VER; skipping duplicate publish."
            exit 0
          fi
          npm publish --provenance --access public

  # Bumping the Homebrew tap requires the published sdist's sha256. This job
  # computes it and opens a bump in the tap repo. Requires a TAP_PUSH_TOKEN
  # secret with write access to RichmondAlake/homebrew-memorizz.
  homebrew:
    needs: pypi
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
    steps:
      # The secrets context is not available in job-level `if:` expressions,
      # so the availability gate lives in a step instead — the old job-level
      # guard meant this job never ran at all.
      - name: Check tap token
        id: gate
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TAP_PUSH_TOKEN not configured - skipping Homebrew tap bump."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute version + sdist sha256
        if: steps.gate.outputs.enabled == 'true'
        id: meta
        run: |
          VER="${RELEASE_TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            URL=$(curl -fsSL "https://pypi.org/pypi/memorizz/$VER/json" \
              | python3 -c "import sys,json;print(next(u['url'] for u in json.load(sys.stdin)['urls'] if u['packagetype']=='sdist'))" 2>/dev/null || true)
            [ -n "$URL" ] && break
            sleep 10
          done
          test -n "$URL"
          curl -fsSL "$URL" -o sdist.tar.gz
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum sdist.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Bump formula in tap
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VER: ${{ steps.meta.outputs.version }}
          URL: ${{ steps.meta.outputs.url }}
          SHA: ${{ steps.meta.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/RichmondAlake/homebrew-memorizz.git" tap
          F=tap/Formula/memorizz.rb
          sed -i -E "s|^  url \".*memorizz-[0-9.]+\.tar\.gz\"|  url \"${URL}\"|" "$F"
          sed -i -E "s|^  sha256 \"[a-f0-9]*\"|  sha256 \"${SHA}\"|" "$F"
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "memorizz ${VER}" && git push
