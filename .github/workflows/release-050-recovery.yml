name: Recover MemoRizz 0.5.0 GitHub Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-050-recovery.yml"

permissions:
  contents: write

jobs:
  github-release:
    if: "${{ github.event.head_commit.message == 'chore: recover v0.5.0 GitHub release' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download immutable PyPI artifacts
        run: |
          mkdir -p dist
          python -m pip download --no-deps --only-binary=:all: \
            --dest dist "memorizz==0.5.0"
          python -m pip download --no-deps --no-binary=:all: \
            --dest dist "memorizz==0.5.0"
          test "$(find dist -type f | wc -l)" -eq 2
      - name: Extract 0.5.0 changelog
        run: |
          awk '
            /^## 0\.5\.0/ { emitting=1 }
            /^## 0\.4\.0/ { emitting=0 }
            emitting { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: MemoRizz 0.5.0
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
